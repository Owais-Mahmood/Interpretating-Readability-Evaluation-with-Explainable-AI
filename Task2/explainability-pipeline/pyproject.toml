[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-pipeline"
version = "0.1.0"
description = "Reusable scaffold for explainability experiments"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Project Team"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "pydantic>=2.6",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
nlp = [
  "torch>=2.2",
  "transformers>=4.40",
  "datasets>=2.18",
  "tokenizers>=0.15",
  "captum>=0.7",
]
vision = [
  "torch>=2.2",
  "torchvision>=0.17",
  "Pillow>=10.0",
  "captum>=0.7",
]
surrogate = ["shap>=0.45", "lime>=0.2.0.1"]
notebooks = ["jupyterlab>=4.1", "ipykernel>=6.29", "nbformat>=5.10"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9", "pre-commit>=3.7"]

[project.scripts]
xai-pipeline = "xai_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
